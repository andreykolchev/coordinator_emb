; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; One 3 MB app partition instead of two 1.25 MB OTA slots: the firmware no longer fits the default
; table, and nothing here uses OTA.
board_build.partitions = huge_app.csv
; The WebSocket library handles incoming messages recursively, and the engine
; and dashboard run inside that call, so loopTask needs more than the default 8 KB.
build_flags = -DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	links2004/WebSockets@^2.4.0
